[project]
name = "pkm-framework"
version = "0.1.3"
description = "Markdown knowledge storage search and MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[project.scripts]
pkm = "pkm_framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm_framework"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

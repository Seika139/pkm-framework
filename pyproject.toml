[project]
name = "pkm-framework"
version = "0.2.1"
description = "Markdown knowledge storage search and MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[project.scripts]
pkm = "pkm_framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm_framework"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sys.path を操作してから隣接 scripts を import する構造のため E402 を除外する
"src/pkm_framework/storage_resources/mise/tasks/*.py" = ["E402"]
"tests/test_scheduler_ownership.py" = ["E402"]

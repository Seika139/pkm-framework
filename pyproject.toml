[project]
name = "pkm-framework"
version = "0.1.0"
description = "Markdown knowledge storage search and MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[project.scripts]
pkm = "pkm_framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm_framework"]

[tool.hatch.build.targets.wheel.force-include]
"src/pkm_framework/skills" = "pkm_framework/skills"
"src/pkm_framework/storage_resources" = "pkm_framework/storage_resources"

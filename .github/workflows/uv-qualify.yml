---
name: Qualify Code (reusable)

permissions:
  contents: read

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  call-common-uv-qualify:
    uses: Seika139/.github/.github/workflows/uv-qualify.yml@main
    with:
      python-version: "3.12"

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      - name: Verify packaged skills and storage resources
        run: |
          python - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("pkm_framework-*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
              source_root = Path("src/pkm_framework")
              expected_skills = {
                  f"pkm_framework/{path.relative_to(source_root).as_posix()}"
                  for path in (source_root / "skills").rglob("SKILL.md")
              }
              if not expected_skills:
                  raise SystemExit("Checkout does not contain any skills to package.")
              missing_skills = sorted(expected_skills - files)
              if missing_skills:
                  raise SystemExit(f"Wheel is missing skills: {missing_skills}")

              manifest_path = "pkm_framework/storage_resources/manifest.json"
              if manifest_path not in files:
                  raise SystemExit(f"Wheel is missing {manifest_path}.")
              manifest = json.loads(archive.read(manifest_path))
              resource_entries = manifest["resources"]
              path_counts = collections.Counter(item["path"] for item in resource_entries)
              duplicate_paths = sorted(
                  path for path, count in path_counts.items() if count > 1
              )
              if duplicate_paths:
                  raise SystemExit(
                      f"Storage resource manifest contains duplicate paths: {duplicate_paths}"
                  )

              resources = {item["path"]: item["sha256"] for item in resource_entries}
              missing = sorted(
                  f"pkm_framework/storage_resources/{path}"
                  for path in resources
                  if f"pkm_framework/storage_resources/{path}" not in files
              )
              if missing:
                  raise SystemExit(f"Wheel is missing manifest resources: {missing}")

              storage_root = source_root / "storage_resources"
              for path, expected_hash in resources.items():
                  source_hash = hashlib.sha256((storage_root / path).read_bytes()).hexdigest()
                  if source_hash != expected_hash:
                      raise SystemExit(
                          f"Storage resource manifest hash mismatch for {path}: "
                          f"expected {expected_hash}, found {source_hash}."
                      )

                  wheel_path = f"pkm_framework/storage_resources/{path}"
                  wheel_hash = hashlib.sha256(archive.read(wheel_path)).hexdigest()
                  if wheel_hash != expected_hash:
                      raise SystemExit(
                          f"Packaged Storage resource hash mismatch for {path}: "
                          f"expected {expected_hash}, found {wheel_hash}."
                      )

          print(
              f"Verified all {len(expected_skills)} skills and {len(resources)} storage resources in {wheel}."
          )
          PY

      - name: Install wheel in isolated environment and smoke test
        run: |
          smoke_env="$RUNNER_TEMP/pkm-wheel-smoke"
          uv venv --python 3.12 "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" dist/*.whl
          "$smoke_env/bin/python" -c "import pkm_framework; import pkm_framework.cli"
          "$smoke_env/bin/pkm" --help

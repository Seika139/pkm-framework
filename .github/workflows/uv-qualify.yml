---
name: Qualify Code (reusable)

permissions:
  contents: read

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  call-common-uv-qualify:
    uses: Seika139/.github/.github/workflows/uv-qualify.yml@main
    with:
      python-version: "3.12"

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      - name: Verify packaged skills and storage resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("pkm_framework-*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
              source_root = Path("src/pkm_framework")
              expected_skills = {
                  f"pkm_framework/{path.relative_to(source_root).as_posix()}"
                  for path in (source_root / "skills").rglob("SKILL.md")
              }
              if not expected_skills:
                  raise SystemExit("Checkout does not contain any skills to package.")
              missing_skills = sorted(expected_skills - files)
              if missing_skills:
                  raise SystemExit(f"Wheel is missing skills: {missing_skills}")

              manifest_path = "pkm_framework/storage_resources/manifest.json"
              if manifest_path not in files:
                  raise SystemExit(f"Wheel is missing {manifest_path}.")
              manifest = json.loads(archive.read(manifest_path))
              resources = {
                  f"pkm_framework/storage_resources/{item['path']}"
                  for item in manifest["resources"]
              }
              missing = sorted(resources - files)
              if missing:
                  raise SystemExit(f"Wheel is missing manifest resources: {missing}")

          print(
              f"Verified all {len(expected_skills)} skills and {len(resources)} storage resources in {wheel}."
          )
          PY

      - name: Install wheel in isolated environment and smoke test
        run: |
          smoke_env="$RUNNER_TEMP/pkm-wheel-smoke"
          uv venv --python 3.12 "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" dist/*.whl
          "$smoke_env/bin/python" -c "import pkm_framework; import pkm_framework.cli"
          "$smoke_env/bin/pkm" --help
